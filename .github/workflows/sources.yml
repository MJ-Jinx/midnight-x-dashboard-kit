name: Refresh articles and code

# Reads your Midnight-related articles and GitHub work from the accounts in sources.json (scripts/fetch-sources.mjs)
# and saves them in data/content.json. Runs every day, and straight after you change your connected accounts.
# Needs no keys. Optional: the DEVTO_API_KEY secret adds your dev.to page views (shown only to you).
on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily, after Refresh X data
  push:
    branches: [main]
    paths: [sources.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Read articles and code
        env:
          GH_TOKEN: ${{ github.token }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/fetch-sources.mjs

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "data: articles and code ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
